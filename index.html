<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telinha</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<meta name="theme-color" content="#0b0f16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  /* Layout: sala escura iluminada pelas telas. Barra fina em cima (sala + quem está), palco no meio, controles numa doca embaixo.
     Visual só escuro de propósito: é uma sala pra assistir vídeo. */
  :root {
    --bg: #0b0f16;          /* tinta azulada da sala */
    --surface: #121823;     /* barras */
    --surface-2: #19212f;   /* botões, chips */
    --surface-3: #222c3e;   /* hover */
    --line: #263145;
    --text: #e8ecf4;
    --muted: #8b97ac;
    --lamp: #ffb547;        /* luz de abajur: ação principal */
    --lamp-ink: #241703;    /* texto em cima do âmbar */
    --onair: #ff4f5e;       /* "no ar" */
    --ok: #46d08a;
    --font-display: "Archivo", system-ui, "Segoe UI", sans-serif;
    --font-ui: "Archivo", system-ui, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --r-sm: 9px; --r-md: 14px;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .mono { font-family: var(--font-mono); }
  .ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ic.sm { width: 14px; height: 14px; }

  /* Botões */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: var(--r-sm);
         background: var(--surface-2); border: 1px solid var(--line); font-weight: 550; cursor: pointer; white-space: nowrap;
         transition: background .12s, border-color .12s, color .12s; }
  .btn:hover { background: var(--surface-3); }
  .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.icon { width: 38px; padding: 0; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn.on { border-color: var(--lamp); color: var(--lamp); }
  .btn.primary { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); font-weight: 680; }
  .btn.primary:hover { background: #ffc266; }
  .btn.live { background: var(--onair); border-color: var(--onair); color: #fff; font-weight: 680; }
  .btn.live:hover { background: #ff6976; }
  .btn.active { background: color-mix(in srgb, var(--lamp) 14%, var(--surface-2)); border-color: color-mix(in srgb, var(--lamp) 60%, transparent); color: var(--lamp); }
  .btn.leave { color: var(--onair); }
  .btn.leave:hover { background: color-mix(in srgb, var(--onair) 14%, var(--surface-2)); border-color: color-mix(in srgb, var(--onair) 50%, transparent); }

  /* Marca: telinha com luz de "no ar" */
  .mark { width: 28px; height: 28px; flex: none; }
  .mark .m-ant { fill: none; stroke: var(--lamp); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .mark .m-body { fill: var(--lamp); }
  .mark .m-screen { fill: var(--bg); }
  .mark .tally { fill: var(--onair); }
  @media (prefers-reduced-motion: no-preference) { .mark .tally { animation: tally 2.4s ease-in-out infinite; } }
  @keyframes tally { 50% { opacity: .35; } }

  /* ---------- Lobby ---------- */
  #lobby { min-height: 100%; display: grid; place-items: center; padding-block: 48px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
           background: radial-gradient(70% 55% at 50% -5%, color-mix(in srgb, var(--lamp) 11%, transparent), transparent 70%); }
  .lobby-in { width: 100%; max-width: 400px; display: grid; gap: 22px; }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .lockup .mark { width: 54px; height: 54px; }
  .wordmark { margin: 0; font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -.02em; }
  .tagline { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; text-wrap: balance; }
  #joinForm { display: grid; gap: 16px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
  .field { display: grid; gap: 7px; }
  .field .lb { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .input { display: flex; align-items: center; height: 46px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); transition: border-color .12s; }
  .input:focus-within { border-color: var(--lamp); }
  .input input { flex: 1; min-width: 0; height: 100%; padding: 0 12px; background: none; border: 0; outline: none; font-size: 16px; }
  .input .pre { padding-left: 12px; color: var(--muted); font-family: var(--font-mono); }
  .input .pre + input { padding-left: 2px; font-family: var(--font-mono); }
  #joinForm .btn { height: 46px; font-size: 16px; margin-top: 4px; }
  .lobby-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; }
  .lobby-foot .install { margin-left: -8px; }
  #ver { color: var(--muted); font-size: 12px; margin-left: auto; }

  /* ---------- Sala ---------- */
  #app { display: flex; flex-direction: column; height: 100%; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
         background: var(--surface); border-bottom: 1px solid var(--line); }
  .room { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .room-name { font: 600 16px/1.1 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28ch; }
  .room-count { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  #people { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; padding-left: 14px; border-left: 1px solid var(--line); }
  .top-actions { display: flex; gap: 6px; margin-left: auto; }

  .person { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px 0 4px; border-radius: 999px;
            background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; }
  .person .av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700;
                background: hsl(var(--h) 38% 30%); color: hsl(var(--h) 85% 86%); box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 3.5px var(--muted); }
  .person.ok .av { box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 3.5px var(--ok); }
  .person.bad .av { box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 3.5px var(--onair); }
  @media (prefers-reduced-motion: no-preference) { .person.wait .av { animation: waiting 1.4s ease-in-out infinite; } }
  @keyframes waiting { 50% { opacity: .45; } }
  .person .nm { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person .me { color: var(--muted); }
  .onair { font: 600 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: #fff; background: var(--onair); padding: 4px 6px; border-radius: 4px; }
  .person .ic { color: var(--lamp); }
  .person .old { font-size: 11.5px; color: var(--lamp); }

  #status { display: none; padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); font-size: 13.5px;
            background: color-mix(in srgb, var(--lamp) 12%, var(--bg)); color: var(--lamp); border-bottom: 1px solid color-mix(in srgb, var(--lamp) 25%, transparent); }
  #status.on { display: block; }

  main { flex: 1; min-height: 0; overflow: auto; padding-block: 14px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  #grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }

  /* Quando ninguém transmite */
  #empty { height: 100%; min-height: 260px; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 24px 0; }
  #empty .mark { width: 76px; height: 76px; opacity: .9; margin-bottom: 6px; }
  #empty h2 { margin: 0; font-family: var(--font-display); font-stretch: 112%; font-weight: 750; font-size: 22px; letter-spacing: -.01em; }
  #empty p { margin: 0 0 8px; color: var(--muted); max-width: 40ch; text-wrap: balance; }

  /* Telas */
  .tile { position: relative; background: #000; border-radius: var(--r-md); overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%;
          max-height: calc(100vh - 190px); border: 1px solid var(--line); }
  .tile.focus { grid-column: 1 / -1; }
  .tile video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; cursor: zoom-in; }
  .tile.focus video { cursor: zoom-out; }
  .tile.mecam video { transform: scaleX(-1); } /* sua câmera aparece espelhada só pra você */
  .tile:fullscreen { border-radius: 0; max-height: none; border: 0; }
  .tile .tag { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px;
               border-radius: 999px; background: rgba(8, 11, 17, .72); backdrop-filter: blur(6px); font-size: 13px; font-weight: 600; transition: opacity .2s; }
  .tile:not(.cam) .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--onair); box-shadow: 0 0 8px var(--onair); }
  .tile.cam .tag .ic { color: var(--lamp); }
  .tile .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 6px; padding: 26px 10px 10px;
               background: linear-gradient(transparent, rgba(5, 7, 11, .8)); opacity: 0; transition: opacity .15s; }
  .tile:hover .bar, .tile .bar:focus-within { opacity: 1; }
  .tile .sp { flex: 1; }
  .tb { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; border: 0; background: rgba(255, 255, 255, .1); color: #fff; cursor: pointer; }
  .tb:hover { background: rgba(255, 255, 255, .2); }
  .tb:focus-visible { outline: 2px solid var(--lamp); outline-offset: 1px; }
  .tile .vol { width: 96px; accent-color: var(--lamp); }
  /* mouse parado em cima do vídeo some (senão fica parecendo 2 mouses) */
  .tile.idle, .tile.idle video { cursor: none; }
  .tile.idle .bar, .tile.idle .tag { opacity: 0; }
  .tile .black { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 20px;
                 color: var(--lamp); font-size: 14px; line-height: 1.55; pointer-events: none; background: color-mix(in srgb, var(--bg) 55%, transparent); }
  .tile .black b { color: var(--text); font-size: 16px; }
  .tile.isblack .black { display: grid; }

  /* Log */
  #logPanel { display: flex; flex-direction: column; height: 30vh; min-height: 150px; background: var(--surface); border-top: 1px solid var(--line); }
  #logPanel .head { display: flex; align-items: center; gap: 6px; padding-block: 6px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); border-bottom: 1px solid var(--line); }
  #logPanel .head b { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-right: auto; }
  #logPanel .head .btn { height: 30px; font-size: 13px; padding: 0 10px; }
  #logBox { flex: 1; overflow: auto; padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
            font: 12px/1.6 var(--font-mono); color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  #logBox .bad { color: #f39a9a; }
  #logBox .good { color: #82dcae; }

  /* Doca de controles */
  .dock { position: relative; display: flex; justify-content: center; align-items: center; gap: 8px; padding-block: 12px;
          padding-left: var(--gutter-l); padding-right: var(--gutter-r); background: var(--surface); border-top: 1px solid var(--line); }
  .dock .btn { height: 46px; padding: 0 18px; }
  .dock .btn.icon { width: 46px; padding: 0; }
  .dock .sep { width: 1px; height: 28px; background: var(--line); margin: 0 6px; }
  #settings { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); width: min(340px, calc(100vw - 32px));
              display: grid; gap: 16px; padding: 18px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md);
              box-shadow: 0 18px 50px rgba(0, 0, 0, .5); z-index: 5; }
  #settings h3 { margin: 0; font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  #settings select { width: 100%; height: 42px; padding: 0 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); }
  .switch { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; cursor: pointer; }
  .switch small { grid-column: 1; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .switch input { grid-column: 2; grid-row: 1; appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--surface-3);
                  border: 1px solid var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
  .switch input:checked { background: var(--lamp); border-color: var(--lamp); }
  .switch input:checked::after { transform: translateX(16px); background: var(--lamp-ink); }
  #upl { font-size: 12.5px; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line); }

  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--line);
           padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
           box-shadow: 0 12px 30px rgba(0, 0, 0, .4); }
  #toast.on { opacity: 1; }

  @media (max-width: 760px) {
    #people { order: 3; flex-basis: 100%; padding-left: 0; border-left: 0; }
  }
  @media (max-width: 560px) {
    .lbl-wide, #camBtn .lbl { display: none; }
    .dock { gap: 6px; }
    .dock .btn { flex: none; padding: 0 14px; }
    #camBtn, #leave { width: 46px; padding: 0; }
    .dock .sep { margin: 0 2px; }
    #copy { width: 38px; padding: 0; font-size: 0; gap: 0; }
    .wordmark { font-size: 34px; }
  }
</style>
</head>
<body>

<!-- Ícones (traço simples, 24x24) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-screen" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="m16 10 5-3v10l-5-3z"/><rect x="2" y="6" width="14" height="12" rx="2"/></symbol>
  <symbol id="i-cam-off" viewBox="0 0 24 24"><path d="m16 10 5-3v10l-5-3z"/><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></symbol>
  <symbol id="i-leave" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>

<div id="lobby">
  <div class="lobby-in">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path class="m-ant" d="M24 9l8 8 8-8"/><rect class="m-body" x="6" y="17" width="52" height="38" rx="9"/><rect class="m-screen" x="11" y="22" width="42" height="28" rx="5"/><path class="m-body" d="M28 29v14l11-7z"/><circle class="tally" cx="47" cy="28" r="3"/></svg>
      <div>
        <h1 class="wordmark">telinha</h1>
        <p class="tagline">Compartilhe a tela e a câmera com os amigos. A voz continua no Discord.</p>
      </div>
    </div>
    <form id="joinForm">
      <label class="field"><span class="lb">Seu nome</span>
        <span class="input"><input type="text" id="name" maxlength="24" autocomplete="off" placeholder="ex: Pedrin"></span>
      </label>
      <label class="field"><span class="lb">Sala</span>
        <span class="input"><span class="pre">#</span><input type="text" id="room" maxlength="40" autocomplete="off" spellcheck="false"></span>
      </label>
      <button class="btn primary" type="submit">Entrar na sala</button>
    </form>
    <div class="lobby-foot">
      <button class="btn ghost install" type="button" hidden><svg class="ic"><use href="#i-download"/></svg>Instalar no PC</button>
      <span id="ver" class="mono"></span>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="room">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path class="m-ant" d="M24 9l8 8 8-8"/><rect class="m-body" x="6" y="17" width="52" height="38" rx="9"/><rect class="m-screen" x="11" y="22" width="42" height="28" rx="5"/><path class="m-body" d="M28 29v14l11-7z"/><circle class="tally" cx="47" cy="28" r="3"/></svg>
      <div>
        <span class="room-name">#<span id="roomName"></span></span>
        <span class="room-count"><span id="count">1</span> na sala</span>
      </div>
    </div>
    <div id="people"></div>
    <div class="top-actions">
      <button class="btn ghost install" hidden title="Instala o Telinha como app no PC (ícone no menu Iniciar, janela própria)"><svg class="ic"><use href="#i-download"/></svg><span class="lbl-wide">Instalar</span></button>
      <button class="btn" id="copy" title="Copia o link da sala pra mandar pros amigos"><svg class="ic"><use href="#i-link"/></svg>Convidar</button>
      <button class="btn icon" id="logBtn" title="Log de conexão. Se der problema, cada um copia o seu e manda." aria-label="Log de conexão"><svg class="ic"><use href="#i-log"/></svg></button>
    </div>
  </header>
  <div id="status"></div>
  <main>
    <div id="grid"></div>
    <div id="empty">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path class="m-ant" d="M24 9l8 8 8-8"/><rect class="m-body" x="6" y="17" width="52" height="38" rx="9"/><rect class="m-screen" x="11" y="22" width="42" height="28" rx="5"/><path class="m-body" d="M28 29v14l11-7z"/><circle class="tally" cx="47" cy="28" r="3"/></svg>
      <h2>Nenhuma tela no ar</h2>
      <p>Compartilhe a sua tela ou espere um amigo começar. Quem entrar depois já vê o que está passando.</p>
      <button class="btn" id="emptyInvite" type="button"><svg class="ic"><use href="#i-link"/></svg>Copiar link da sala</button>
    </div>
  </main>
  <section id="logPanel" hidden>
    <div class="head">
      <b>Log de conexão</b>
      <button class="btn" id="logCopy" title="Copia o log com o resumo de quem está conectado"><svg class="ic sm"><use href="#i-copy"/></svg>Copiar</button>
      <button class="btn icon" id="logClose" title="Fechar" aria-label="Fechar log" style="width:30px"><svg class="ic sm"><use href="#i-x"/></svg></button>
    </div>
    <div id="logBox"></div>
  </section>
  <footer class="dock">
    <button class="btn" id="camBtn" title="Liga sua câmera pros amigos (sem som: a voz continua no Discord)"><svg class="ic"><use href="#i-cam-off"/></svg><span class="lbl">Câmera</span></button>
    <button class="btn primary" id="share"><svg class="ic"><use href="#i-screen"/></svg><span class="lbl">Compartilhar tela</span></button>
    <button class="btn icon" id="setBtn" title="Qualidade e som da transmissão" aria-label="Ajustes da transmissão" aria-expanded="false"><svg class="ic"><use href="#i-sliders"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn leave" id="leave" title="Sair da sala"><svg class="ic"><use href="#i-leave"/></svg><span class="lbl-wide">Sair</span></button>
    <div id="settings" hidden>
      <h3>Transmissão</h3>
      <label class="field"><span class="lb">Qualidade</span><select id="quality"></select></label>
      <label class="switch">Áudio do PC
        <input type="checkbox" id="audio" checked>
        <small>Manda o som do PC junto. Se for a tela inteira, a voz do Discord vai junto e os amigos ouvem eco. Compartilhar só uma aba evita isso.</small>
      </label>
      <div id="upl" class="mono"></div>
    </div>
  </footer>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);

// Prefixo dos IDs no servidor público do PeerJS (o servidor é só pra "apresentar" os PCs; o vídeo vai direto).
// Cada pessoa ocupa um "lugar" na sala: telinha-v2-<sala>-p1, -p2, ... Não tem recepção central:
// quem chega tenta conectar em todos os lugares, e um lugar travado não atrapalha os outros.
const PREFIX = 'telinha-v2-';
const MAX_SLOTS = 12;
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const VERSION = 11; // sobe a cada atualização; quem estiver com versão menor aparece com ⚠️
const slotId = n => PREFIX + S.room + '-p' + n;
const slotOf = id => +(/-p(\d+)$/.exec(id)?.[1] || 0);

// STUN do Google ajuda os PCs a se acharem pela internet.
// Se algum amigo nunca conectar (NAT chato / CGNAT), adicione um servidor TURN aqui.
const ICE = { iceServers: [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
  // { urls: 'turn:SEU_SERVIDOR:3478', username: 'usuario', credential: 'senha' },
]};

const QUALITY = {
  jogo720:  { label: 'Jogo · 720p 60fps',          h: 720,  fps: 60, br: 4_500_000, hint: 'motion' },
  jogo1080: { label: 'Jogo HD · 1080p 60fps',      h: 1080, fps: 60, br: 8_000_000, hint: 'motion' },
  texto:    { label: 'Texto/código · 1080p 30fps', h: 1080, fps: 30, br: 3_000_000, hint: 'detail' },
  fraca:    { label: 'Internet fraca · 720p 30fps', h: 720, fps: 30, br: 1_500_000, hint: 'motion' },
};

const S = {
  name: '', room: '', me: null, slot: 0, slotTry: 1, tick: 0,
  peers: new Map(),   // id -> { id, name, sharing, conn, inCall, failed, seen }
  screen: null, quality: QUALITY.jogo720,
  out: new Map(),     // id -> chamada saindo com a minha tela
  cam: null,          // minha câmera (stream), se ligada
  outCam: new Map(),  // id -> chamada saindo com a minha câmera
  tiles: new Map(),   // id ('me' pra mim; 'x|cam' pra câmera) -> { el, video }
  log: [],
  left: false,
};

function log(...a) {
  const line = new Date().toLocaleTimeString('pt-BR') + '  ' + a.join(' ');
  S.log.push(line); if (S.log.length > 400) S.log.shift();
  console.log('[telinha]', line);
  appendLogLine(line);
}

function appendLogLine(line) {
  const box = document.getElementById('logBox');
  if (!box) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const d = document.createElement('div');
  d.textContent = line;
  if (/erro|fechou|caiu|failed|disconnected|desconectou|não consegui|perdi|antiga|sem vídeo/i.test(line)) d.className = 'bad';
  else if (/→ connected|conectado com|conectado ao/i.test(line)) d.className = 'good';
  box.appendChild(d);
  while (box.childElementCount > 400) box.firstChild.remove();
  if (atBottom) box.scrollTop = box.scrollHeight;
}
function who(id) { const n = S.peers.get(id)?.name; return n && n !== '…' ? n : 'lugar ' + slotOf(id); }

// Fica de olho numa conexão WebRTC: se cair de vez (ou ficar "disconnected" por 8s), avisa.
function watchPc(pc, label, onDead) {
  if (!pc) return;
  let t;
  pc.addEventListener('connectionstatechange', () => {
    const s = pc.connectionState;
    log(typeof label === 'function' ? label() : label, '→', s);
    clearTimeout(t);
    if (s === 'failed') onDead();
    else if (s === 'disconnected') t = setTimeout(() => {
      if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') onDead();
    }, 8000);
  });
}

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

function slug(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/, '');
}

let toastT;
function toast(msg, ms = 3500) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function status(msg) { const s = $('#status'); s.textContent = msg || ''; s.classList.toggle('on', !!msg); }

/* ---------- Lobby ---------- */
$('#name').value = store.get('telinha.name') || '';
$('#room').value = slug(decodeURIComponent(location.hash.slice(1))) || ('sala-' + Math.random().toString(36).slice(2, 7));
for (const [k, q] of Object.entries(QUALITY)) $('#quality').add(new Option(q.label, k));
const savedQ = store.get('telinha.quality'); if (QUALITY[savedQ]) { $('#quality').value = savedQ; S.quality = QUALITY[savedQ]; }
const savedA = store.get('telinha.audio'); if (savedA !== null) $('#audio').checked = savedA === '1';
(!$('#name').value ? $('#name') : $('#room')).focus();

$('#joinForm').addEventListener('submit', e => { e.preventDefault(); join(); });
// Abriu um link de outra sala com a página já aberta? Sai da sala atual e vai pro lobby da nova.
window.addEventListener('hashchange', () => {
  const r = slug(decodeURIComponent(location.hash.slice(1)));
  if (!r) return;
  if (!S.me) $('#room').value = r;
  else if (r !== S.room) { try { sessionStorage.setItem('telinha.in', r); } catch {} shutdown(); location.reload(); }
});
$('#ver').textContent = 'v' + VERSION;

// Instalar como app (Chrome/Edge): o navegador avisa quando dá pra instalar, aí mostra o botão.
let installEvt = null;
const showInstall = on => document.querySelectorAll('.install').forEach(b => b.hidden = !on);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(true); });
window.addEventListener('appinstalled', () => { installEvt = null; showInstall(false); toast('Instalado! O Telinha está no menu Iniciar.'); });
document.querySelectorAll('.install').forEach(b => b.addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch {}
  installEvt = null; showInstall(false);
}));

function join() {
  const room = slug($('#room').value);
  if (!room) { $('#room').focus(); toast('Escolhe um nome de sala'); return; }
  S.name = $('#name').value.trim().slice(0, 24) || 'Anônimo';
  S.room = room;
  store.set('telinha.name', S.name);
  try { history.replaceState(null, '', '#' + room); } catch {}
  try { sessionStorage.setItem('telinha.in', room); } catch {} // F5 volta direto pra sala

  $('#lobby').hidden = true; $('#app').hidden = false;
  $('#roomName').textContent = room;
  document.title = 'Telinha · #' + room;
  if (!navigator.mediaDevices?.getDisplayMedia) {
    $('#share').disabled = true;
    $('#share').title = 'Seu navegador não deixa compartilhar a tela (use Chrome, Edge ou Firefox no PC). Você ainda pode assistir.';
  }
  updateUpload();
  status('Conectando ao servidor…');

  S.slotTry = 1;
  startPeer();
}

// Pega o primeiro lugar livre da sala (1, 2, 3…). Lugar ocupado, até por alguém travado, só pula pro próximo.
function startPeer() {
  if (S.left) return;
  if (S.slotTry > MAX_SLOTS) { status(`A sala está cheia (máximo ${MAX_SLOTS} lugares).`); log('sala cheia'); return; }
  const n = S.slotTry;
  const peer = new Peer(slotId(n), { config: ICE, debug: 0 });
  let opened = false;
  peer.on('open', () => {
    if (opened) { if (S.me === peer) { log('reconectado ao servidor'); status(''); } return; }
    opened = true; S.me = peer; S.slot = n;
    log(`conectado ao servidor: você está no lugar ${n} da sala`);
    status('');
    peer.on('connection', c => { if (c.metadata?.kind === 'peer') setupConn(c); else c.close(); });
    peer.on('call', onCall);
    peer.on('disconnected', () => {
      if (S.left) return;
      log('servidor de sinalização desconectou');
      status('Conexão com o servidor caiu, reconectando… (quem já está conectado continua vendo)');
      S.lastRecon = Date.now();
      setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch {} }, 1500);
    });
    probeAll(true);
    renderPeople();
  });
  peer.on('error', e => {
    if (opened) { onMeError(e); return; }
    try { peer.destroy(); } catch {}
    if (e.type === 'unavailable-id') { log(`lugar ${n} ocupado`); S.slotTry++; startPeer(); return; }
    log('erro ao conectar no servidor:', e.type);
    status('Sem conexão com o servidor (0.peerjs.com). Tentando de novo…');
    setTimeout(startPeer, 3000);
  });
}

// Tenta conectar nos outros lugares. Quem acabou de chegar procura todo mundo;
// depois disso, a cada 8s, o lugar menor procura os maiores (pra achar quem chegar).
function probeAll(initial) {
  if (!S.me || S.me.disconnected || S.left) return;
  for (let n = 1; n <= MAX_SLOTS; n++) {
    if (n === S.slot) continue;
    const id = slotId(n);
    if (S.peers.get(id)?.conn) continue; // já conectado ou tentando
    if (initial || S.slot < n) linkPeer(id);
  }
}

function onMeError(e) {
  if (e.type === 'peer-unavailable') {
    // Lugar vazio (normal ao procurar) ou alguém que saiu.
    const id = String(e.message || '').replace(/^.*peer\s+/i, '').trim();
    const p = S.peers.get(id);
    if (p && !p.conn?.open) {
      const c = p.conn; p.conn = null;
      if (p.seen) { log(who(id), 'não está mais na sala'); if (!videoAlive(p)) dropPeer(id); }
      else if (!videoAlive(p)) S.peers.delete(id);
      try { c?.close(); } catch {}
    }
    return;
  }
  if (e.type === 'unavailable-id') { // caí do servidor e alguém pegou meu lugar: entra de novo
    log('perdi meu lugar na sala, entrando de novo');
    try { sessionStorage.setItem('telinha.in', S.room); } catch {}
    shutdown(); location.reload();
    return;
  }
  log('erro peer:', e.type, e.message || '');
  if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) {
    status('Sem conexão com o servidor de sinalização (0.peerjs.com). Tentando de novo…');
  } else if (e.type === 'browser-incompatible') {
    status('Seu navegador não suporta WebRTC.');
  }
}

/* ---------- Conexões diretas entre os amigos ---------- */
function peerRec(id) {
  let p = S.peers.get(id);
  if (!p) { p = { id, name: '…', sharing: false, conn: null, inCall: null, failed: false, seen: false }; S.peers.set(id, p); }
  return p;
}

function linkPeer(id) {
  if (!S.me || S.me.disconnected) return;
  const c = S.me.connect(id, { reliable: true, metadata: { kind: 'peer' } });
  if (!c) return;
  c._out = true;
  peerRec(id).lastTry = Date.now();
  setupConn(c);
  setTimeout(() => {
    if (c.open) return;
    const p = S.peers.get(id);
    if (p && p.conn === c) {
      p.conn = null;
      if (p.seen) { log('não consegui conectar com', who(id)); p.failed = true; renderPeople(); }
      else if (!videoAlive(p)) S.peers.delete(id); // lugar travado/vazio: ignora em silêncio
    }
    try { c.close(); } catch {}
  }, 20000);
}

// Se as duas pontas tentarem ao mesmo tempo, fica a conexão aberta pelo lugar menor.
// Fora isso, uma conexão nova substitui a antiga (o outro lado achou que ela morreu).
function setupConn(c) {
  const id = c.peer, p = peerRec(id);
  const old = p.conn;
  if (old && old !== c) {
    if (!c._out && old._out && !old.open && S.slot < slotOf(id)) { c.close(); return; }
    if (old.open) log('trocando conexão antiga com', who(id));
    try { old.close(); } catch {}
  }
  p.conn = c; p.failed = false;
  c.on('open', () => {
    const q = S.peers.get(id);
    if (q?.conn !== c) { try { c.close(); } catch {} return; }
    q.seen = true; q.lostAt = 0;
    c.send({ t: 'hello', v: VERSION, name: S.name, sharing: !!S.screen, cam: !!S.cam });
    if (S.screen && !alive(S.out.get(id))) callScreen(id);
    renderPeople(); updateUpload();
  });
  c.on('data', d => onPeerData(id, d));
  c.on('close', () => {
    if (S.peers.get(id)?.conn !== c) return;
    log('conexão com', who(id), 'fechou');
    connLost(id);
  });
  c.on('error', e => {
    const q = S.peers.get(id);
    if (q?.seen) log('erro conexão', who(id), e.type, e.message || '');
    // Falhou antes de abrir? Não espera o timeout: tenta de novo já.
    if (!c.open && q?.conn === c) { q.conn = null; try { c.close(); } catch {} if (q.seen) scheduleRelink(id); else if (!videoAlive(q)) S.peers.delete(id); }
  });
  watchPc(c.peerConnection, () => 'conexão ' + who(id), () => { try { c.close(); } catch {} });
}

// Dados e vídeo são conexões separadas. Se só a de dados cair, o vídeo continua e a gente reconecta os dados por trás.
function alive(call) { const s = call?.peerConnection?.connectionState; return s === 'connected' || s === 'connecting' || s === 'new'; }
function videoAlive(p) { return alive(p.inCall) || alive(S.out.get(p.id)) || alive(p.camIn) || alive(S.outCam.get(p.id)); }

function connLost(id) {
  const p = S.peers.get(id);
  if (!p) return;
  p.conn = null; p.lostAt = Date.now();
  if (videoAlive(p)) log('vídeo com', who(id), 'continua; reconectando só os dados');
  renderPeople(); updateUpload();
  scheduleRelink(id);
}

// Reconexão rápida: quem está no lugar menor reabre. (O vigia também tenta a cada 8s.)
function scheduleRelink(id) {
  if (S.left || !(S.slot < slotOf(id))) return;
  setTimeout(() => {
    if (S.left || !S.peers.has(id) || S.peers.get(id)?.conn) return;
    log('reconectando com', who(id));
    linkPeer(id);
  }, 1000 + Math.random() * 1000);
}

function onPeerData(id, d) {
  const p = S.peers.get(id);
  if (!p || !d) return;
  if (d.t === 'hello') {
    p.name = String(d.name || '?').slice(0, 24); p.sharing = !!d.sharing;
    log('conectado com', p.name);
    p.v = +d.v || 0; p.cam = !!d.cam;
    p.old = !(d.v >= VERSION);
    if (p.old) log(p.name, 'está com uma versão antiga do Telinha');
    // Câmera só pra quem tem v9+ (versão antiga confundiria a câmera com a tela).
    if (S.cam && p.v >= 9 && !alive(S.outCam.get(id))) callCam(id);
  }
  else if (d.t === 'sharing') { p.sharing = !!d.on; if (!d.on) closeIn(id); }
  else if (d.t === 'cam') { p.cam = !!d.on; if (!d.on) closeCamIn(id); }
  else if (d.t === 'bye') { log(who(id), 'saiu da sala'); dropPeer(id); return; }
  else if (d.t === 'want' && d.kind === 'cam') { log(who(id), 'pediu a câmera de novo'); if (S.cam) callCam(id); return; }
  else if (d.t === 'want') { log(who(id), 'pediu o vídeo de novo'); if (S.screen) callScreen(id); return; }
  renderPeople(); updateTileLabel(id);
}

function dropPeer(id) {
  const p = S.peers.get(id);
  if (!p) return;
  closeIn(id); closeCamIn(id);
  const o = S.out.get(id); if (o) { S.out.delete(id); try { o.close(); } catch {} }
  const oc = S.outCam.get(id); if (oc) { S.outCam.delete(id); try { oc.close(); } catch {} }
  S.peers.delete(id);
  try { p.conn?.close(); } catch {}
  renderPeople(); updateUpload();
}

/* ---------- Vídeo ---------- */
function onCall(call) {
  if (call.metadata?.kind === 'cam') return onCamCall(call);
  const id = call.peer, p = peerRec(id);
  if (p.inCall && p.inCall !== call) try { p.inCall.close(); } catch {}
  p.inCall = call;
  call.answer(); // só assiste, não manda nada de volta
  log('recebendo vídeo de', who(id));
  call.on('stream', s => { if (p.inCall === call) { p.sharing = true; addTile(id, s, false); renderPeople(); } });
  call.on('close', () => { if (p.inCall === call) { log('vídeo de', who(id), 'fechou'); p.inCall = null; removeTile(id); } });
  call.on('error', e => log('erro vídeo de', who(id), e.type));
  // Se o vídeo cair, fecha e o vigia abaixo pede de novo.
  watchPc(call.peerConnection, 'vídeo de ' + who(id), () => { if (p.inCall === call) closeIn(id); });
}

function closeIn(id) {
  const p = S.peers.get(id);
  if (p?.inCall) { const c = p.inCall; p.inCall = null; try { c.close(); } catch {} }
  removeTile(id);
}

/* ---------- Câmera (separada da tela: cada uma tem sua própria conexão de vídeo) ---------- */
const CAM = { w: 640, h: 360, fps: 30, br: 700_000 };

function onCamCall(call) {
  const id = call.peer, p = peerRec(id);
  if (p.camIn && p.camIn !== call) try { p.camIn.close(); } catch {}
  p.camIn = call;
  call.answer();
  log('recebendo câmera de', who(id));
  call.on('stream', s => { if (p.camIn === call) { p.cam = true; addTile(id + '|cam', s, false); renderPeople(); } });
  call.on('close', () => { if (p.camIn === call) { log('câmera de', who(id), 'fechou'); p.camIn = null; removeTile(id + '|cam'); } });
  call.on('error', e => log('erro câmera de', who(id), e.type));
  watchPc(call.peerConnection, 'câmera de ' + who(id), () => { if (p.camIn === call) closeCamIn(id); });
}

function closeCamIn(id) {
  const p = S.peers.get(id);
  if (p?.camIn) { const c = p.camIn; p.camIn = null; try { c.close(); } catch {} }
  removeTile(id + '|cam');
}

async function startCam() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: CAM.w }, height: { ideal: CAM.h }, frameRate: { ideal: CAM.fps, max: CAM.fps } },
      audio: false,
    });
  } catch (e) {
    if (e.name === 'NotAllowedError') toast('Câmera bloqueada. Clica no 🔒/📷 do lado do endereço e libera a câmera.', 6000);
    else if (e.name === 'NotFoundError') toast('Nenhuma câmera encontrada.');
    else if (e.name === 'NotReadableError') toast('A câmera está sendo usada por outro programa (Discord, OBS…). Fecha lá e tenta de novo.', 6000);
    else toast('Não deu pra abrir a câmera: ' + e.message);
    return;
  }
  const v = stream.getVideoTracks()[0];
  try { v.contentHint = 'motion'; } catch {}
  v.addEventListener('ended', stopCam); // câmera desconectada
  S.cam = stream;
  log('câmera ligada');
  addTile('me|cam', stream, true);
  for (const p of S.peers.values()) if (p.conn?.open) {
    p.conn.send({ t: 'cam', on: true });
    if (p.v >= 9) callCam(p.id);
  }
  updateCamBtn(); renderPeople(); updateUpload();
}

function callCam(id) {
  if (!S.cam || !S.me) return;
  const old = S.outCam.get(id); if (old) try { old.close(); } catch {}
  const call = S.me.call(id, S.cam, { metadata: { kind: 'cam' } });
  if (!call) return;
  S.outCam.set(id, call);
  call.on('close', () => { if (S.outCam.get(id) === call) S.outCam.delete(id); });
  call.on('error', e => log('erro enviando câmera pra', who(id), e.type));
  const pc = call.peerConnection;
  if (pc) pc.addEventListener('connectionstatechange', () => { if (pc.connectionState === 'connected') setBitrate(pc, CAM.br, CAM.fps); });
  watchPc(pc, 'minha câmera pra ' + who(id), () => { if (S.outCam.get(id) === call) { S.outCam.delete(id); try { call.close(); } catch {} } });
  updateUpload();
}

function stopCam() {
  if (!S.cam) return;
  S.cam.getTracks().forEach(t => t.stop());
  S.cam = null;
  for (const c of S.outCam.values()) try { c.close(); } catch {}
  S.outCam.clear();
  for (const p of S.peers.values()) if (p.conn?.open) try { p.conn.send({ t: 'cam', on: false }); } catch {}
  removeTile('me|cam');
  log('câmera desligada');
  updateCamBtn(); renderPeople(); updateUpload();
}

function updateCamBtn() {
  const b = $('#camBtn');
  b.querySelector('.lbl').textContent = S.cam ? 'Câmera ligada' : 'Câmera';
  b.querySelector('use').setAttribute('href', S.cam ? '#i-cam' : '#i-cam-off');
  b.classList.toggle('active', !!S.cam);
  b.title = S.cam ? 'Desliga sua câmera' : 'Liga sua câmera pros amigos (sem som: a voz continua no Discord)';
}

// Ícone SVG do sprite lá de cima.
const icon = (id, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

async function startShare() {
  const q = S.quality;
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: q.fps, max: q.fps }, height: { ideal: q.h, max: q.h } },
      audio: $('#audio').checked,
      systemAudio: 'include', selfBrowserSurface: 'exclude', surfaceSwitching: 'include',
    });
  } catch (e) {
    if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') toast('Não deu pra capturar a tela: ' + e.message);
    return;
  }
  const v = stream.getVideoTracks()[0];
  try { v.contentHint = q.hint; } catch {}
  v.addEventListener('ended', stopShare); // botão "Parar de compartilhar" do navegador
  S.screen = stream;
  addTile('me', stream, true);
  for (const p of S.peers.values()) if (p.conn?.open) { p.conn.send({ t: 'sharing', on: true }); callScreen(p.id); }
  updateShareBtn(); renderPeople(); updateUpload();
}

function callScreen(id) {
  const old = S.out.get(id); if (old) try { old.close(); } catch {}
  const call = S.me.call(id, S.screen, { metadata: { kind: 'screen' } });
  if (!call) return;
  S.out.set(id, call);
  call.on('close', () => { if (S.out.get(id) === call) S.out.delete(id); });
  call.on('error', e => log('erro enviando vídeo pra', who(id), e.type));
  const pc = call.peerConnection;
  if (pc) pc.addEventListener('connectionstatechange', () => { if (pc.connectionState === 'connected') setBitrate(pc); });
  watchPc(pc, 'meu vídeo pra ' + who(id), () => { if (S.out.get(id) === call) { S.out.delete(id); try { call.close(); } catch {} } });
  updateUpload();
}

/* ---------- Vigia: conserta sozinho o que caiu ---------- */
setInterval(() => {
  if (!S.me || S.left) return;
  const now = Date.now();
  if (S.me.disconnected && !S.me.destroyed && now - (S.lastRecon || 0) > 5000) {
    S.lastRecon = now; try { S.me.reconnect(); } catch {}
  }
  if (S.me.disconnected) return;
  // A cada 8s: procura quem chegou / reconecta quem caiu (o lugar menor procura os maiores).
  if (++S.tick % 4 === 0) probeAll(false);
  // Sumiu há 30s sem conexão nem vídeo? Tira da lista.
  for (const p of [...S.peers.values()]) {
    if (p.seen && !p.conn && p.lostAt && now - p.lostAt > 30000 && !videoAlive(p)) {
      log(p.name, 'sumiu (sem resposta há 30s)'); dropPeer(p.id);
    }
  }
  // Alguém está transmitindo mas o vídeo não chegou? Pede de novo.
  for (const p of S.peers.values()) {
    if (!p.conn?.open || !p.sharing || S.tiles.has(p.id)) { p.noVideoSince = 0; continue; }
    if (!p.noVideoSince) p.noVideoSince = now;
    if (now - p.noVideoSince > 4000 && now - (p.lastWant || 0) > 8000) {
      p.lastWant = now;
      log('sem vídeo de', p.name, '— pedindo de novo');
      try { p.conn.send({ t: 'want' }); } catch {}
    }
  }
  // Mesma coisa pra câmera.
  for (const p of S.peers.values()) {
    if (!p.conn?.open || !p.cam || S.tiles.has(p.id + '|cam')) { p.noCamSince = 0; continue; }
    if (!p.noCamSince) p.noCamSince = now;
    if (now - p.noCamSince > 4000 && now - (p.lastWantCam || 0) > 8000) {
      p.lastWantCam = now;
      log('sem câmera de', p.name, '— pedindo de novo');
      try { p.conn.send({ t: 'want', kind: 'cam' }); } catch {}
    }
  }
}, 2000);

function setBitrate(pc, br = S.quality.br, fps = S.quality.fps) {
  if (!pc) return;
  for (const s of pc.getSenders()) {
    if (s.track?.kind !== 'video') continue;
    const p = s.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = br;
    p.encodings[0].maxFramerate = fps;
    s.setParameters(p).catch(e => console.warn('[bitrate]', e.message));
  }
}

function stopShare() {
  if (!S.screen) return;
  S.screen.getTracks().forEach(t => t.stop());
  S.screen = null;
  for (const c of S.out.values()) try { c.close(); } catch {}
  S.out.clear();
  for (const p of S.peers.values()) if (p.conn?.open) p.conn.send({ t: 'sharing', on: false });
  removeTile('me');
  updateShareBtn(); renderPeople(); updateUpload();
}

/* ---------- Tela ---------- */
function addTile(id, stream, isMe) {
  let t = S.tiles.get(id);
  if (!t) {
    const el = document.createElement('div');
    const isCam = id.endsWith('|cam');
    el.className = 'tile' + (isCam ? ' cam' : '') + (id === 'me|cam' ? ' mecam' : '');
    el.innerHTML = '<video autoplay playsinline></video><div class="black"></div>'
      + '<div class="tag">' + (isCam ? icon('i-cam', 'ic sm') : '') + '<span class="who"></span></div>'
      + '<div class="bar">'
      + (isMe || isCam ? '' : '<button class="tb mute" title="Ligar/desligar som" aria-label="Ligar/desligar som">' + icon('i-vol') + '</button><input class="vol" type="range" min="0" max="1" step="0.05" value="1" title="Volume" aria-label="Volume">')
      + '<span class="sp"></span><button class="tb fs" title="Tela cheia" aria-label="Tela cheia">' + icon('i-full') + '</button></div>';
    const video = el.querySelector('video');
    video.muted = isMe;
    t = { el, video, isMe, cam: isCam, dark: 0 };
    // Mouse parado 2s em cima do vídeo: esconde o mouse e a barra.
    const wake = () => {
      el.classList.remove('idle'); clearTimeout(t.idleT);
      t.idleT = setTimeout(() => { if (!el.querySelector('.bar:focus-within')) el.classList.add('idle'); }, 2000);
    };
    el.addEventListener('mousemove', wake);
    el.addEventListener('mouseleave', () => { clearTimeout(t.idleT); el.classList.remove('idle'); });
    video.addEventListener('click', () => el.classList.toggle('focus'));
    video.addEventListener('dblclick', () => fullscreen(el));
    el.querySelector('.fs').addEventListener('click', () => fullscreen(el));
    if (!isMe && !isCam) {
      const mute = el.querySelector('.mute'), vol = el.querySelector('.vol');
      t.updMute = () => { mute.querySelector('use').setAttribute('href', video.muted ? '#i-mute' : '#i-vol'); };
      mute.addEventListener('click', () => { video.muted = !video.muted; t.updMute(); if (!video.muted) video.play().catch(() => {}); });
      vol.addEventListener('input', () => { video.volume = +vol.value; if (video.muted && +vol.value > 0) { video.muted = false; t.updMute(); } });
    }
    S.tiles.set(id, t);
    // Câmera fica do lado da tela da mesma pessoa.
    const base = id.replace(/\|cam$/, ''), sib = S.tiles.get(t.cam ? base : base + '|cam');
    if (sib) { if (t.cam) sib.el.after(el); else sib.el.before(el); }
    else if (isMe) $('#grid').prepend(el); else $('#grid').appendChild(el);
  }
  if (t.video.srcObject !== stream) {
    t.video.srcObject = stream;
    t.video.play().catch(() => {
      t.video.muted = true; t.updMute?.();
      t.video.play().catch(() => {});
      toast('O navegador bloqueou o som. Passa o mouse no vídeo e clica no ícone de som.');
    });
  }
  updateTileLabel(id); refreshEmpty();
}

function removeTile(id) {
  const t = S.tiles.get(id);
  if (!t) return;
  t.video.srcObject = null; t.el.remove(); S.tiles.delete(id);
  refreshEmpty();
}

function updateTileLabel(id) {
  for (const k of [id.replace(/\|cam$/, ''), id.replace(/\|cam$/, '') + '|cam']) {
    const t = S.tiles.get(k);
    if (!t) continue;
    const base = k.replace(/\|cam$/, '');
    t.el.querySelector('.who').textContent = (base === 'me' ? 'Você' : (S.peers.get(base)?.name || '?'));
  }
}

function fullscreen(el) {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else el.requestFullscreen?.().catch(() => {});
}

function refreshEmpty() { $('#empty').hidden = S.tiles.size > 0; }

/* Tela preta: jogo em tela cheia exclusiva não deixa o navegador capturar (só sai o mouse).
   A cada 2s olha uma miniatura do vídeo; 6s quase tudo preto = mostra o aviso no vídeo. */
const blackCv = document.createElement('canvas'); blackCv.width = 32; blackCv.height = 18;
const blackCx = blackCv.getContext('2d', { willReadFrequently: true });
function isBlackFrame(video) {
  if (!video.videoWidth || video.readyState < 2) return null;
  try {
    blackCx.drawImage(video, 0, 0, 32, 18);
    const d = blackCx.getImageData(0, 0, 32, 18).data;
    let dark = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i] + d[i + 1] + d[i + 2] < 45) dark++;
    return dark / (d.length / 4) >= 0.97; // sobra espaço pro mouse desenhado em cima do preto
  } catch { return null; }
}
setInterval(() => {
  for (const [id, t] of S.tiles) {
    if (t.cam) continue; // câmera tampada/escura não é problema de jogo
    const b = isBlackFrame(t.video);
    if (b === null) continue;
    t.dark = b ? t.dark + 1 : 0;
    const on = t.dark >= 3;
    if (on === t.el.classList.contains('isblack')) continue;
    t.el.classList.toggle('isblack', on);
    const name = S.peers.get(id)?.name || '?';
    if (on) {
      t.el.querySelector('.black').innerHTML = t.isMe
        ? '<div><b>Sua tela está saindo preta pros amigos</b><br>Jogo em tela cheia não deixa o navegador capturar.<br>No jogo, muda o modo de vídeo pra <b>Janela sem bordas</b> (Borderless),<br>ou para e compartilha a <b>Tela inteira</b> em vez da janela.</div>'
        : '<div><b>A tela de ' + esc(name) + ' está chegando preta</b><br>Se for jogo, pede pra colocar em <b>Janela sem bordas</b> (Borderless)<br>ou compartilhar a <b>Tela inteira</b> em vez da janela.</div>';
      log(t.isMe ? 'minha transmissão está saindo preta (jogo em tela cheia?)' : 'vídeo de ' + name + ' chegando preto');
    } else log(t.isMe ? 'minha transmissão voltou a ter imagem' : 'vídeo de ' + name + ' voltou a ter imagem');
  }
}, 2000);

function renderPeople() {
  const box = $('#people'); box.textContent = '';
  const add = (name, st, { live, cam, old, me } = {}, title) => {
    const c = document.createElement('span');
    c.className = 'person ' + st; if (title) c.title = title;
    const av = document.createElement('span');
    av.className = 'av'; av.textContent = (name.trim()[0] || '?').toUpperCase();
    av.style.setProperty('--h', [...name].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 7));
    const nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = name;
    c.append(av, nm);
    if (me) c.insertAdjacentHTML('beforeend', '<span class="me">você</span>');
    if (live) c.insertAdjacentHTML('beforeend', '<span class="onair">ao vivo</span>');
    if (cam) c.insertAdjacentHTML('beforeend', icon('i-cam', 'ic sm'));
    if (old) c.insertAdjacentHTML('beforeend', '<span class="old">versão antiga</span>');
    box.appendChild(c);
  };
  add(S.name, 'ok', { me: true, live: !!S.screen, cam: !!S.cam });
  let n = 1;
  for (const p of S.peers.values()) {
    if (!p.seen) continue; // lugares vazios/travados não aparecem
    n++;
    const st = p.conn?.open ? 'ok' : (p.failed && !videoAlive(p) ? 'bad' : 'wait');
    let title = st === 'bad' ? 'Não conseguiu conectar direto com essa pessoa (rede/NAT). Ver TURN no código.'
      : st === 'wait' ? (videoAlive(p) ? 'Reconectando (o vídeo continua)…' : 'Conectando…') : '';
    if (p.old) title = 'Essa pessoa está com uma versão antiga do Telinha: pede pra ela atualizar o arquivo/página. ' + title;
    add(p.name, st, { live: p.sharing, cam: p.cam, old: p.old }, title);
  }
  $('#count').textContent = n;
}

function updateShareBtn() {
  const b = $('#share');
  b.classList.toggle('live', !!S.screen); b.classList.toggle('primary', !S.screen);
  b.querySelector('.lbl').textContent = S.screen ? 'Parar transmissão' : 'Compartilhar tela';
  b.querySelector('use').setAttribute('href', S.screen ? '#i-stop' : '#i-screen');
}

function updateUpload() {
  const viewers = [...S.peers.values()].filter(p => p.conn?.open).length;
  const mbps = S.quality.br / 1e6;
  const sending = (S.screen ? mbps : 0) + (S.cam ? CAM.br / 1e6 : 0);
  $('#upl').textContent = sending
    ? `upload ≈ ${(sending * Math.max(1, viewers)).toFixed(1)} Mb/s`
    : `≈ ${mbps.toFixed(1)} Mb/s por amigo`;
  $('#upl').title = 'Cada amigo assistindo recebe uma cópia da sua tela (e da câmera), então o upload soma.';
}

/* ---------- Controles ---------- */
$('#share').addEventListener('click', () => S.screen ? stopShare() : startShare());
$('#camBtn').addEventListener('click', () => S.cam ? stopCam() : startCam());
if (!navigator.mediaDevices?.getUserMedia) { $('#camBtn').disabled = true; $('#camBtn').title = 'Seu navegador não deixa usar a câmera aqui.'; }

$('#quality').addEventListener('change', () => {
  const k = $('#quality').value;
  S.quality = QUALITY[k]; store.set('telinha.quality', k);
  if (S.screen) {
    const v = S.screen.getVideoTracks()[0], q = S.quality;
    v.applyConstraints({ frameRate: { ideal: q.fps, max: q.fps }, height: { ideal: q.h, max: q.h } }).catch(() => {});
    try { v.contentHint = q.hint; } catch {}
    for (const c of S.out.values()) setBitrate(c.peerConnection);
  }
  updateUpload();
});

$('#audio').addEventListener('change', () => {
  store.set('telinha.audio', $('#audio').checked ? '1' : '0');
  if (S.screen) toast('Vale na próxima vez que compartilhar.');
});

$('#copy').addEventListener('click', async () => {
  const isFile = location.protocol === 'file:';
  const txt = isFile ? S.room : location.href.split('#')[0] + '#' + S.room;
  try {
    await navigator.clipboard.writeText(txt);
    toast(isFile ? 'Nome da sala copiado. Seus amigos abrem o mesmo arquivo e entram nessa sala.' : 'Link copiado! Manda pros amigos.');
  } catch { prompt('Copia aí:', txt); }
});

$('#logBtn').addEventListener('click', () => {
  const panel = $('#logPanel');
  panel.hidden = !panel.hidden;
  $('#logBtn').classList.toggle('on', !panel.hidden);
  if (!panel.hidden) { const b = $('#logBox'); b.scrollTop = b.scrollHeight; }
});
$('#logClose').addEventListener('click', () => { $('#logPanel').hidden = true; $('#logBtn').classList.remove('on'); });

// Ajustes da transmissão (qualidade, áudio do PC): abre em cima da doca.
const setOpen = on => { $('#settings').hidden = !on; $('#setBtn').classList.toggle('on', on); $('#setBtn').setAttribute('aria-expanded', on); };
$('#setBtn').addEventListener('click', () => setOpen($('#settings').hidden));
document.addEventListener('click', e => { if (!$('#settings').hidden && !e.target.closest('#settings, #setBtn')) setOpen(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
$('#emptyInvite').addEventListener('click', () => $('#copy').click());

$('#logCopy').addEventListener('click', async () => {
  const peers = [...S.peers.values()].filter(p => p.seen).map(p => `  ${p.name}: ${p.conn?.open ? 'conectado' : 'sem conexão'}${p.sharing ? ', transmitindo' : ''}${S.tiles.has(p.id) ? ', vídeo chegando' : ''}`);
  const txt = [`Telinha v${VERSION} · sala #${S.room} · ${S.name} (lugar ${S.slot}) · ${new Date().toLocaleString('pt-BR')}`,
    `transmitindo: ${S.screen ? 'sim (' + S.quality.label + ')' : 'não'} · câmera: ${S.cam ? 'ligada' : 'desligada'}`, 'pessoas:', ...peers, '', ...S.log].join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Log copiado!'); } catch { prompt('Copia aí:', txt); }
});

// Avisa todo mundo que estou saindo, pra ninguém ficar esperando a conexão morrer sozinha.
function sayBye() {
  for (const p of S.peers.values()) if (p.conn?.open) try { p.conn.send({ t: 'bye' }); } catch {}
}

function shutdown() {
  if (S.left) return;
  sayBye();
  S.left = true;
  try { stopShare(); } catch {}
  try { stopCam(); } catch {}
  try { S.me?.destroy(); } catch {}
}
$('#leave').addEventListener('click', () => {
  try { sessionStorage.removeItem('telinha.in'); } catch {}
  sayBye(); setTimeout(() => { shutdown(); location.reload(); }, 300);
});
window.addEventListener('pagehide', shutdown);

// Deu F5 dentro de uma sala? Entra de novo direto, sem passar pelo lobby.
try {
  const r = slug(decodeURIComponent(location.hash.slice(1)));
  if (r && sessionStorage.getItem('telinha.in') === r && $('#name').value.trim()) { $('#room').value = r; join(); }
} catch {}
</script>
</body>
